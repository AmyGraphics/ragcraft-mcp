name: ragcraft-mcp
displayName: RAGCraft - Semantic Chunking, Vector Embeddings & Hybrid Search MCP
description: Universal RAG (Retrieval-Augmented Generation) & knowledge engine for Cursor, Claude & Windsurf. Generates optimal semantic chunks with overlap, computes vector embedding and database costs, synthesizes hybrid search queries (BM25 + Cosine RRF), and benchmarks retrieval accuracy.
